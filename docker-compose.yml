services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: superkb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  hindsight:
    # RAG indexer: extracts, chunks, and vectorizes documents into banks.
    # LLM provider/key/model come from .env (MiniMax by default).
    image: ghcr.io/vectorize-io/hindsight:latest
    env_file: .env
    environment:
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER:-minimax}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:-}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:-MiniMax-Text-01}
      HINDSIGHT_API_LLM_BASE_URL: ${HINDSIGHT_API_LLM_BASE_URL:-}
      HINDSIGHT_API_LLM_EXTRA_BODY: ${HINDSIGHT_API_LLM_EXTRA_BODY:-null}
      HINDSIGHT_API_LLM_STRICT_SCHEMA: ${HINDSIGHT_API_LLM_STRICT_SCHEMA:-}
      HINDSIGHT_API_LLM_MAX_CONCURRENT: ${HINDSIGHT_API_LLM_MAX_CONCURRENT:-}
      HINDSIGHT_API_RETAIN_LLM_MAX_CONCURRENT: ${HINDSIGHT_API_RETAIN_LLM_MAX_CONCURRENT:-}
      HINDSIGHT_API_LLM_MAX_RETRIES: ${HINDSIGHT_API_LLM_MAX_RETRIES:-}
      HINDSIGHT_API_LLM_INITIAL_BACKOFF: ${HINDSIGHT_API_LLM_INITIAL_BACKOFF:-}
      HINDSIGHT_API_LLM_MAX_BACKOFF: ${HINDSIGHT_API_LLM_MAX_BACKOFF:-}
      # Embeddings via 9router (OpenAI-compatible). host.docker.internal maps to
      # the host gateway so the container can reach 9router on the host.
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: ${HINDSIGHT_API_EMBEDDINGS_PROVIDER:-local}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: ${HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL:-}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: ${HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY:-}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: ${HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL:-text-embedding-3-small}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_DIMENSIONS: ${HINDSIGHT_API_EMBEDDINGS_OPENAI_DIMENSIONS:-}
      # Gemini embeddings (optional remote provider). Used when
      # HINDSIGHT_API_EMBEDDINGS_PROVIDER=google. Switching embedding provider
      # changes the vector space/dimension and REQUIRES rebuilding every bank.
      HINDSIGHT_API_EMBEDDINGS_GEMINI_API_KEY: ${HINDSIGHT_API_EMBEDDINGS_GEMINI_API_KEY:-}
      HINDSIGHT_API_EMBEDDINGS_GEMINI_MODEL: ${HINDSIGHT_API_EMBEDDINGS_GEMINI_MODEL:-gemini-embedding-001}
      # NOTE: GEMINI_OUTPUT_DIMENSIONALITY is int-parsed by Hindsight and must be
      # OMITTED (not empty) when unused. Add it back ONLY when PROVIDER=google,
      # e.g. HINDSIGHT_API_EMBEDDINGS_GEMINI_OUTPUT_DIMENSIONALITY=768
      # Reranker (recall speed). Search reranks retrieved candidates with a
      # cross-encoder. FlashRank TinyBERT-L-2 on CPU reranks ~44 candidates in
      # ~0.25s (vs ~3.5-6.6s for heavier local cross-encoders), which is the
      # single biggest lever for sub-500ms KB search. Recall-only: changing
      # these needs only a Hindsight restart, never a bank rebuild.
      HINDSIGHT_API_RERANKER_PROVIDER: ${HINDSIGHT_API_RERANKER_PROVIDER:-flashrank}
      HINDSIGHT_API_RERANKER_FLASHRANK_MODEL: ${HINDSIGHT_API_RERANKER_FLASHRANK_MODEL:-ms-marco-TinyBERT-L-2-v2}
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES: ${HINDSIGHT_API_RERANKER_MAX_CANDIDATES:-50}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8888:8888" # API
      - "9999:9999" # Control plane UI
    volumes:
      - hindsightdata:/home/hindsight/.pg0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  superkb:
    # The superkb engine. Stores raw docs in R2, groups them into knowledge
    # bases, and builds RAG snapshots via Hindsight.
    build: .
    env_file: .env
    environment:
      # Override host-specific URLs for in-container networking. R2 + LLM
      # secrets are inherited from .env unchanged.
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/superkb?sslmode=disable
      HINDSIGHT_BASE_URL: http://hindsight:8888
    extra_hosts:
      # Lets the container reach host services (e.g. 9router for vision OCR)
      # via host.docker.internal, matching the VISION_OCR_BASE_URL in .env.
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      hindsight:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  hindsightdata:
